services:
  db:
    image: postgres:16-alpine
    container_name: backend-starter-db
    environment:
      POSTGRES_DB: booksdb
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: books_password
    ports:
      - "5432:5432"
    volumes:
      - books_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books_user -d booksdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  book-api:
    build: .
    container_name: backend-starter-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/booksdb
      SPRING_DATASOURCE_USERNAME: books_user
      SPRING_DATASOURCE_PASSWORD: books_password
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  books_data:
